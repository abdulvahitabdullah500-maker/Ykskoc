name: APK Üret (YKS Koç)

# Depoya kod gönderdiğinde otomatik olarak Android APK üretir.
# Üretilen dosya: Actions sekmesi > son çalışma > Artifacts > yks-koc-apk
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    name: Android APK derle
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Paketleri kur
        run: npm install --no-audit --no-fund

      - name: Android projesini üret (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: APK derle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK adını düzenle
        run: |
          mkdir -p cikti
          cp android/app/build/outputs/apk/debug/app-debug.apk cikti/yks-koc.apk
          ls -lh cikti

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: yks-koc-apk
          path: cikti/yks-koc.apk
          if-no-files-found: error
          retention-days: 30
